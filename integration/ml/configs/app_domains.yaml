# Manual domain mapping of AURA appName values (author: Claude Code, from app names only).
# Used for sampling/stratification and per-domain bias reporting, NOT as a model feature.
# Apps not listed in any domain default to `consumer_other` (social, media, tools).
# `games` are excluded from the core annotation sample (PROJECT_IMPLEMENTATION_PLAN_AR.md §2).
