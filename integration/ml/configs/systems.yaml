# Registry of digital systems for explicit-mention detection (ml/src/systems.py). Add a system by adding an entry;
# no model retraining is needed. Matching is on normalised text (alif/ya/ta-marbuta/diacritics), word-bounded,
# Arabic proclitics و/ف/ب/ل/ك allowed before a name.
#
#   aliases      : names that identify the system on their own (multi-word Arabic names, Latin spellings)
#   ambiguous    : names that are also ordinary Arabic words/phrases ("ابشر" = "sure", "صحتي" = "my health").
#                  Accepted only with context: a cue word just before (تطبيق/منصة/موقع/... see context_cues),
#                  or the name in quotes. Otherwise reported as an ambiguous possible mention, NOT identified.
#   exclude_after: phrases that, right after an ambiguous name, show the ordinary meaning (توكلنا على الله)
#
# Scope v1: Saudi government / public digital services (the AURA gov apps + the services named in the P1 brief).
# Registry author: Claude Code from public service names; frozen as v1 before the P1 mention evaluation.
version: "1.1"   # 1.1 = v1 + aliases found in the v1 error analysis (reports/p1_report.md); v1 = commit a3035f4

context_cues:          # within the 2 tokens before an ambiguous name
  ar: [تطبيق, التطبيق, تطبيقات, برنامج, البرنامج, منصة, المنصة, منصه, المنصه, موقع, الموقع, بوابة, البوابة, بوابه, البوابه, نظام, خدمة, خدمات, حساب]
  en: [app, application, platform, portal, website, system]

generic_references:    # refer to *a* system without naming it
  ar: [التطبيق, البرنامج, المنصة, المنصه, الموقع, البوابة, البوابه, النظام, الابلكيشن, الأبلكيشن]
  en: [the app, this app, the application, the website, the platform, the system]

systems:
  - id: absher
    name_ar: أبشر
    name_en: Absher
    aliases: ["أبشر أفراد", "أبشر أعمال", Absher]
    ambiguous: [أبشر]
  - id: nafath
